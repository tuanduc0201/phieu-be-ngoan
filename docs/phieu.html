<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#120D1A">
<meta name="description" content="Một tấm phiếu bé ngoan dành riêng cho người thương.">
<meta name="color-scheme" content="dark">
<style>*{margin:0;padding:0}html,body{min-height:100%}svg,img{max-width:100%}</style>
<title>Phiếu Bé Ngoan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    /* nền đêm */
    --dem:      #120D1A;
    --dem-2:    #1A1226;
    --the:      #1F1730;
    --the-2:    #2C1A34;

    /* chữ */
    --nga:      #F7EFE8;
    --nga-mo:   #CFC3C9;
    --xam:      #9C90AA;   /* xám lệch tím cho ăn với sắc nhấn */

    /* nhấn */
    --hong:     #FF5E7A;
    --hong-nhat:#FFA8B8;
    --dong:     #E4B363;

    --vien:     rgba(247, 239, 232, 0.14);
    --vien-ro:  rgba(247, 239, 232, 0.28);

    --serif: Fraunces, "Playfair Display", Georgia, "Times New Roman", serif;
    --sans: "Be Vietnam Pro", "Segoe UI", system-ui, -apple-system, sans-serif;

    /* viền trắng kiểu sticker + bóng nổi */
    --keyline:
      drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff)
      drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff)
      drop-shadow(1.5px 1.5px 0 #fff) drop-shadow(-1.5px 1.5px 0 #fff)
      drop-shadow(1.5px -1.5px 0 #fff) drop-shadow(-1.5px -1.5px 0 #fff)
      drop-shadow(0 8px 14px rgba(0, 0, 0, 0.45));
  }

  body {
    margin: 0;
    background: var(--dem);
    color: var(--nga);
    font-family: var(--sans);
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  :focus-visible { outline: 2px solid var(--hong); outline-offset: 3px; border-radius: 8px; }

  /* ---------- sảnh: chỉ có tấm phiếu, không có gì khác ---------- */
  .sanh {
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: clamp(30px, 6vw, 56px) clamp(28px, 5vw, 40px);
    position: relative;
    overflow: hidden;
  }
  .sanh::before {
    content: "";
    position: absolute; inset: -20%;
    background:
      radial-gradient(38% 30% at 22% 18%, rgba(255, 94, 122, 0.16), transparent 70%),
      radial-gradient(34% 28% at 82% 82%, rgba(228, 179, 99, 0.12), transparent 70%);
    pointer-events: none;
  }

  /* tim bay lơ lửng phía sau, rất nhẹ */
  .bui { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .bui i {
    position: absolute;
    display: block;
    width: 14px; height: 14px;
    background: var(--hong);
    opacity: .12;
    clip-path: path("M7 13.5C3.9 11 0.5 8.6 0.5 5.4 0.5 3 2.4 1.3 4.5 1.3c1.2 0 2.2.5 2.5 1.4.3-.9 1.3-1.4 2.5-1.4 2.1 0 4 1.7 4 4.1 0 3.2-3.4 5.6-6.5 8.1z");
    transform: scale(1);
  }
  .bui i:nth-child(1) { left: 12%; top: 22%; width: 26px; height: 26px; }
  .bui i:nth-child(2) { left: 80%; top: 30%; width: 18px; height: 18px; }
  .bui i:nth-child(3) { left: 26%; top: 74%; width: 34px; height: 34px; opacity: .08; }
  .bui i:nth-child(4) { left: 68%; top: 80%; width: 20px; height: 20px; }

  /* ============ TẤM PHIẾU ============ */
  .the {
    position: relative;
    width: 100%;
    max-width: 560px;
    padding: clamp(26px, 6.5vw, 44px) clamp(22px, 6vw, 40px) clamp(22px, 5vw, 34px);
    border-radius: 28px;
    background:
      radial-gradient(120% 80% at 12% 0%, rgba(255, 94, 122, 0.22), transparent 60%),
      radial-gradient(90% 70% at 100% 100%, rgba(228, 179, 99, 0.16), transparent 62%),
      linear-gradient(158deg, var(--the-2), var(--the) 58%);
    border: 1px solid var(--vien-ro);
    box-shadow: 0 40px 80px -40px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    container-type: inline-size;
  }
  /* vệt sáng chéo rất nhẹ, cho cảm giác giấy tráng */
  .the::after {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    background: linear-gradient(102deg, transparent 42%, rgba(255, 255, 255, 0.05) 50%, transparent 58%);
    pointer-events: none;
  }

  .dau-the {
    display: flex; align-items: center;
    gap: 14px;
    padding-right: clamp(58px, 20cqw, 92px);   /* chừa chỗ cho mèo dán góc trên */
    padding-bottom: 16px;
    border-bottom: 1px solid var(--vien);
  }
  .nhan-the {
    font-size: clamp(.62rem, 2.4cqw, .74rem);
    font-weight: 600;
    letter-spacing: .32em;
    text-transform: uppercase;
    color: var(--dong);
  }
  .so-the {
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    color: var(--nga-mo);
  }

  .trao {
    margin: clamp(20px, 5cqw, 30px) 0 0;
    font-size: clamp(.78rem, 3cqw, .9rem);
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--xam);
  }

  .ten {
    margin: .18em 0 0;
    font-family: var(--serif);
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: clamp(2.3rem, 13cqw, 3.9rem);
    line-height: 1.02;
    letter-spacing: -0.02em;
    text-wrap: balance;
    color: var(--nga);
  }
  .ten::after {
    content: "";
    display: block;
    width: clamp(52px, 18cqw, 84px);
    height: 3px;
    margin-top: .42em;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--hong), rgba(255, 94, 122, 0));
  }

  .tim {
    display: flex; gap: .32em;
    margin-top: clamp(18px, 4.4cqw, 26px);
  }
  .tim svg { width: clamp(20px, 6.2cqw, 27px); height: auto; display: block; }
  .tim .tat { opacity: .22; }

  .vi {
    margin: clamp(16px, 4cqw, 22px) 0 0;
    font-family: var(--serif);
    font-weight: 500;
    font-style: italic;
    font-size: clamp(1.06rem, 4.6cqw, 1.42rem);
    line-height: 1.5;
    color: var(--nga);
    text-wrap: pretty;
  }
  .vi span { color: var(--xam); font-style: normal; font-family: var(--sans); font-size: .74em; display: block; margin-bottom: .3em; letter-spacing: .16em; text-transform: uppercase; }

  /* cuống vé "đổi được" */
  .doi {
    margin-top: clamp(22px, 5.4cqw, 32px);
    padding: clamp(14px, 3.6cqw, 20px) clamp(16px, 4cqw, 22px);
    border: 1px dashed var(--vien-ro);
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.035);
    display: flex; flex-direction: column; gap: .28em;
  }
  .doi-nhan {
    font-size: clamp(.6rem, 2.4cqw, .7rem);
    font-weight: 600;
    letter-spacing: .26em;
    text-transform: uppercase;
    color: var(--dong);
  }
  .doi-noi {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(1.12rem, 5cqw, 1.5rem);
    line-height: 1.25;
    color: var(--nga);
    text-wrap: balance;
  }

  .chan-the {
    margin-top: clamp(22px, 5.4cqw, 32px);
    padding-top: clamp(14px, 3.4cqw, 18px);
    border-top: 1px solid var(--vien);
    display: flex; align-items: flex-end; justify-content: space-between; gap: 18px;
  }
  .chan-the div { display: flex; flex-direction: column; gap: .3em; }
  .chan-the .nhan-nho {
    font-size: .62rem; letter-spacing: .2em; text-transform: uppercase; color: var(--xam);
  }
  .chan-the b {
    font-family: var(--serif); font-weight: 600;
    font-size: clamp(.98rem, 4cqw, 1.14rem);
    color: var(--nga);
  }
  .chan-the .ngay b { font-variant-numeric: tabular-nums; }
  .chan-the .ngay { text-align: right; }

  .hieu-luc {
    margin-top: clamp(12px, 3cqw, 16px);
    font-size: .64rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--xam);
    opacity: .8;
  }

  /* ============ MÈO DÁN ============ */
  .meo {
    position: absolute;
    filter: var(--keyline);
    pointer-events: none;
    z-index: 2;
  }
  .meo svg { width: 100%; height: auto; display: block; }
  .meo-1 { width: clamp(74px, 21cqw, 108px); top: -34px;  right: -18px; transform: rotate(9deg); }
  .meo-2 { width: clamp(58px, 16cqw, 82px);  bottom: -20px; right: -22px; transform: rotate(-11deg); }
  .meo-3 { width: clamp(48px, 13cqw, 66px);  bottom: 34%; left: -24px; transform: rotate(14deg); }

  @media (prefers-reduced-motion: no-preference) {
    .meo-1 { animation: nhun-meo 3.4s ease-in-out infinite; }
    @keyframes nhun-meo {
      0%, 100% { transform: rotate(9deg) translateY(0); }
      50%      { transform: rotate(9deg) translateY(-5px); }
    }
  }

  /* ---------- xuất hiện ---------- */
  @media (prefers-reduced-motion: no-preference) {
    .the { animation: len .7s cubic-bezier(.16, .8, .3, 1) both; }
    @keyframes len { from { opacity: 0; transform: translateY(22px) scale(.985); } }
    .the .tim svg { animation: bung .45s cubic-bezier(.2, .9, .3, 1.5) both; }
    .the .tim svg:nth-child(1) { animation-delay: .42s; }
    .the .tim svg:nth-child(2) { animation-delay: .50s; }
    .the .tim svg:nth-child(3) { animation-delay: .58s; }
    .the .tim svg:nth-child(4) { animation-delay: .66s; }
    .the .tim svg:nth-child(5) { animation-delay: .74s; }
    @keyframes bung { from { opacity: 0; transform: scale(.4) rotate(-14deg); } }
    .bui i { animation: troi 9s ease-in-out infinite alternate; }
    .bui i:nth-child(2) { animation-duration: 11s; animation-delay: -3s; }
    .bui i:nth-child(3) { animation-duration: 13s; animation-delay: -6s; }
    .bui i:nth-child(4) { animation-duration: 10s; animation-delay: -1.5s; }
    @keyframes troi { to { transform: translate(14px, -22px) rotate(12deg); } }
  }

  @media print {
    .sanh { min-height: 0; padding: 0; }
    .sanh::before, .bui { display: none; }
    .the { box-shadow: none; animation: none; max-width: none; }
    .the .tim svg { animation: none; }
  }
</style>
</head>

<script>
/* Dữ liệu phiếu + bộ dựng thẻ, dùng chung cho trang tạo và trang phiếu.

   Nội dung phiếu nằm trong phần neo (#...) của địa chỉ dưới dạng base64url của
   JSON. Phần neo không được gửi lên máy chủ, nên lời nhắn không lọt vào log của
   GitHub Pages. */
var PHIEU = (function () {
  "use strict";

  var MEO = ["meo-tim", "meo-map", "meo-vay", "meo-ngu"];
  var MEO_TEN = { "meo-tim": "Mèo ôm tim", "meo-map": "Mèo mập", "meo-vay": "Mèo vẫy tay", "meo-ngu": "Mèo ngủ" };

  var GOI_Y_LOI = [
    "ăn hết suất dù không thích rau",
    "đi ngủ trước mười hai giờ, ba đêm liền",
    "kiên nhẫn nghe anh kể chuyện công việc suốt bốn mươi phút",
    "không dỗi khi anh về muộn",
    "tự giác uống đủ nước cả tuần",
    "cười thật khi anh kể chuyện cười nhạt"
  ];
  var GOI_Y_THUONG = [
    "một lần được chọn phim, không được cãi",
    "một bữa ăn tuỳ chọn, anh trả",
    "một cái ôm mười phút, không nói gì",
    "một buổi ngủ nướng, anh dọn nhà",
    "một lời xin lỗi vô điều kiện"
  ];

  function homNay() {
    var d = new Date(), hai = function (x) { return (x < 10 ? "0" : "") + x; };
    return hai(d.getDate()) + "." + hai(d.getMonth() + 1) + "." + d.getFullYear();
  }

  function macDinh() {
    return {
      t: "Người Thương",
      l: GOI_Y_LOI[2],
      r: GOI_Y_THUONG[0],
      g: "Anh",
      s: "5",
      c: "meo-tim",
      n: homNay()
    };
  }

  // --- mã hoá / giải mã phần neo ---
  function b64url(s) {
    return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function unB64url(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    return atob(s);
  }
  function nhiPhanSangChuoi(u8) {
    var s = "", i;
    for (i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]);
    return s;
  }

  function maHoa(d) {
    var gon = {}, k;
    var md = macDinh();
    for (k in d) if (d[k] && d[k] !== md[k]) gon[k] = d[k];   // chỉ ghi phần khác mặc định cho mã QR gọn
    if (!Object.keys(gon).length) return "";
    return b64url(nhiPhanSangChuoi(new TextEncoder().encode(JSON.stringify(gon))));
  }

  function giaiMa(neo) {
    var d = macDinh();
    if (!neo) return d;
    try {
      var raw = unB64url(neo.replace(/^#/, ""));
      var u8 = new Uint8Array(raw.length), i;
      for (i = 0; i < raw.length; i++) u8[i] = raw.charCodeAt(i);
      var o = JSON.parse(new TextDecoder().decode(u8));
      for (i in o) if (typeof o[i] === "string" || typeof o[i] === "number") d[i] = String(o[i]);
    } catch (e) { /* neo hỏng thì dùng mặc định */ }
    return d;
  }

  function tuDiaChi() { return giaiMa(location.hash); }

  function diaChiPhieu(goc, d) {
    var m = maHoa(d);
    return goc + (m ? "#" + m : "");
  }

  // --- dựng thẻ ---
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function soPhieu(d) {
    var s = (d.t || "") + "|" + (d.l || ""), h = 7, i;
    for (i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 997;
    return "Số " + ("00" + (h % 999 + 1)).slice(-3);
  }

  function timHtml(n) {
    n = Math.max(0, Math.min(5, parseInt(n, 10) || 0));
    var s = "", i;
    for (i = 1; i <= 5; i++) {
      s += '<svg viewBox="0 0 32 30" class="' + (i <= n ? "bat" : "tat") +
           '" fill="' + (i <= n ? "#FF5E7A" : "#F7EFE8") + '" aria-hidden="true"><use href="#tim"/></svg>';
    }
    return s;
  }

  function meoHtml(c) {
    if (MEO.indexOf(c) < 0) c = "meo-tim";
    var phu = c === "meo-ngu" ? "meo-map" : "meo-ngu";
    return '<div class="meo meo-1"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#' + c + '"/></svg></div>' +
           '<div class="meo meo-2"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#' + phu + '"/></svg></div>' +
           '<div class="meo meo-3"><svg viewBox="0 0 32 30" fill="#FF5E7A" aria-hidden="true"><use href="#tim"/></svg></div>';
  }

  function veThe(el, d) {
    var n = Math.max(0, Math.min(5, parseInt(d.s, 10) || 0));
    el.innerHTML =
      '<div class="dau-the"><span class="nhan-the">Phiếu bé ngoan</span></div>' +
      '<p class="trao">Trao cho</p>' +
      '<h1 class="ten">' + esc(d.t || macDinh().t) + '</h1>' +
      '<div class="tim" role="img" aria-label="' + n + ' trên 5 tim">' + timHtml(n) + '</div>' +
      '<p class="vi"><span>Vì đã</span>' + esc(d.l) + '</p>' +
      (d.r ? '<div class="doi"><span class="doi-nhan">Đổi được</span>' +
             '<strong class="doi-noi">' + esc(d.r) + '</strong></div>' : '') +
      '<div class="chan-the">' +
        '<div><span class="nhan-nho">Người trao</span><b>' + esc(d.g) + '</b></div>' +
        '<div class="ngay"><span class="nhan-nho">Ngày</span><b>' + esc(d.n) + '</b></div>' +
      '</div>' +
      '<div class="hieu-luc"><span class="so-the">' + esc(soPhieu(d)) + '</span>' +
      ' · vô thời hạn · không hoàn lại</div>' +
      meoHtml(d.c);
  }

  return {
    MEO: MEO, MEO_TEN: MEO_TEN,
    GOI_Y_LOI: GOI_Y_LOI, GOI_Y_THUONG: GOI_Y_THUONG,
    macDinh: macDinh, homNay: homNay,
    maHoa: maHoa, giaiMa: giaiMa, tuDiaChi: tuDiaChi, diaChiPhieu: diaChiPhieu,
    veThe: veThe
  };
})();
</script>
<script>
(function () {
  var d = PHIEU.tuDiaChi();
  PHIEU.veThe(document.getElementById("the"), d);
  if (d.t) document.title = "Phiếu bé ngoan · " + d.t;
  // đổi nội dung khi phần neo thay đổi (bấm lại liên kết khác)
  window.addEventListener("hashchange", function () {
    var m = PHIEU.tuDiaChi();
    PHIEU.veThe(document.getElementById("the"), m);
    if (m.t) document.title = "Phiếu bé ngoan · " + m.t;
  });
})();
</script>
</body>
