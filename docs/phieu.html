<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F1FAF6">
<meta name="description" content="Một tấm phiếu bé ngoan.">
<meta name="color-scheme" content="light">
<style>*{margin:0;padding:0}html,body{min-height:100%}svg,img{max-width:100%}</style>
<title>Phiếu Bé Ngoan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    /* nền sáng: mint sương và kem */
    --nen:      #F1FAF6;
    --nen-2:    #FFF7EC;
    --the:      #FFFFFF;
    --the-2:    #F3FFFB;

    /* chữ: mực xanh rừng, không dùng đen thuần */
    --muc:      #163B36;
    --muc-mo:   #3E625C;
    --xam:      #7F9A94;

    /* sắc nhấn pastel */
    --mint:     #17B195;
    --mint-nhat:#B6EFE1;
    --mint-rat: #E4FAF4;
    --dao:      #FF9E86;
    --vang:     #FFC95C;
    --lav:      #B9AEFF;

    --vien:     rgba(22, 59, 54, 0.12);
    --vien-ro:  rgba(22, 59, 54, 0.26);

    --serif: "Bricolage Grotesque", "Be Vietnam Pro", system-ui, sans-serif;
    --sans: "Be Vietnam Pro", "Segoe UI", system-ui, -apple-system, sans-serif;

    /* viền trắng kiểu sticker + bóng nổi */
    --keyline:
      drop-shadow(2.5px 0 0 #fff) drop-shadow(-2.5px 0 0 #fff)
      drop-shadow(0 2.5px 0 #fff) drop-shadow(0 -2.5px 0 #fff)
      drop-shadow(1.8px 1.8px 0 #fff) drop-shadow(-1.8px 1.8px 0 #fff)
      drop-shadow(1.8px -1.8px 0 #fff) drop-shadow(-1.8px -1.8px 0 #fff)
      drop-shadow(0 6px 12px rgba(22, 59, 54, 0.22));
  }

  body {
    margin: 0;
    background: var(--nen);
    color: var(--muc);
    font-family: var(--sans);
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  :focus-visible { outline: 2px solid var(--mint); outline-offset: 3px; border-radius: 8px; }

  /* ---------- sảnh: chỉ có tấm phiếu, không có gì khác ---------- */
  .sanh {
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: clamp(30px, 6vw, 56px) clamp(28px, 5vw, 40px);
    position: relative;
    overflow: hidden;
  }
  .sanh::before {
    content: "";
    position: absolute; inset: -20%;
    background:
      radial-gradient(40% 32% at 18% 14%, var(--mint-nhat), transparent 68%),
      radial-gradient(36% 30% at 86% 86%, #FFE7C2, transparent 66%);
    opacity: .55;
    pointer-events: none;
  }

  /* sao pastel lơ lửng phía sau, rất nhẹ */
  .bui { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .bui i {
    position: absolute;
    display: block;
    width: 22px; height: 22px;
    opacity: .5;
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  }
  .bui i:nth-child(1) { left: 11%; top: 20%; width: 30px; height: 30px; background: var(--vang); }
  .bui i:nth-child(2) { left: 82%; top: 28%; width: 20px; height: 20px; background: var(--mint); opacity: .38; }
  .bui i:nth-child(3) { left: 24%; top: 76%; width: 38px; height: 38px; background: var(--lav); opacity: .42; }
  .bui i:nth-child(4) { left: 70%; top: 82%; width: 24px; height: 24px; background: var(--dao); opacity: .45; }

  /* ============ TẤM PHIẾU ============ */
  .the {
    position: relative;
    width: 100%;
    max-width: 560px;
    padding: clamp(26px, 6.5vw, 44px) clamp(22px, 6vw, 40px) clamp(22px, 5vw, 34px);
    border-radius: 28px;
    background:
      radial-gradient(120% 80% at 6% 0%, var(--mint-rat), transparent 58%),
      radial-gradient(90% 70% at 100% 100%, #FFF4E2, transparent 60%),
      linear-gradient(158deg, var(--the-2), var(--the) 62%);
    border: 1px solid var(--vien);
    box-shadow: 0 28px 60px -34px rgba(22, 59, 54, 0.45), 0 2px 0 rgba(22, 59, 54, 0.04);
    container-type: inline-size;
  }
  /* dải mint mảnh ở mép trên, cho ra dáng giấy in */
  .the::before {
    content: "";
    position: absolute; top: 0; left: 0; right: 0;
    height: 6px;
    border-radius: 28px 28px 0 0;
    background: linear-gradient(90deg, var(--mint), var(--mint-nhat) 45%, var(--vang));
  }

  .dau-the {
    display: flex; align-items: center;
    gap: 14px;
    padding-right: clamp(58px, 20cqw, 92px);   /* chừa chỗ cho mèo dán góc trên */
    padding-bottom: 16px;
    border-bottom: 1px solid var(--vien);
  }
  .nhan-the {
    font-size: clamp(.86rem, 3.6cqw, 1.12rem);
    font-weight: 700;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--mint);
  }
  .so-the {
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    color: var(--muc-mo);
  }

  .trao {
    margin: clamp(20px, 5cqw, 30px) 0 0;
    font-size: clamp(.78rem, 3cqw, .9rem);
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--xam);
  }

  .ten {
    margin: .14em 0 0;
    font-family: var(--serif);
    font-weight: 700;
    font-size: clamp(2.2rem, 12.5cqw, 3.7rem);
    line-height: 1.02;
    letter-spacing: -0.03em;
    text-wrap: balance;
    color: var(--muc);
  }
  .ten::after {
    content: "";
    display: block;
    width: clamp(56px, 20cqw, 92px);
    height: 5px;
    margin-top: .38em;
    border-radius: 5px;
    background: linear-gradient(90deg, var(--mint), var(--mint-nhat));
  }

  .sao {
    display: flex; gap: .3em;
    margin-top: clamp(18px, 4.4cqw, 26px);
  }
  .sao svg { width: clamp(22px, 6.6cqw, 30px); height: auto; display: block; }
  .sao .tat { opacity: .16; }

  .vi {
    margin: clamp(16px, 4cqw, 22px) 0 0;
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(1.06rem, 4.6cqw, 1.38rem);
    line-height: 1.45;
    letter-spacing: -0.01em;
    color: var(--muc);
    text-wrap: pretty;
  }
  .vi span {
    display: block;
    margin-bottom: .34em;
    font-family: var(--sans);
    font-size: .68em;
    font-weight: 600;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--xam);
  }

  /* cuống vé "đổi được" */
  .doi {
    margin-top: clamp(22px, 5.4cqw, 32px);
    padding: clamp(14px, 3.6cqw, 20px) clamp(16px, 4cqw, 22px);
    border: 2px dashed var(--mint-nhat);
    border-radius: 18px;
    background: var(--mint-rat);
    display: flex; flex-direction: column; gap: .3em;
  }
  .doi-nhan {
    font-size: clamp(.6rem, 2.4cqw, .7rem);
    font-weight: 600;
    letter-spacing: .24em;
    text-transform: uppercase;
    color: var(--mint);
  }
  .doi-noi {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(1.1rem, 5cqw, 1.44rem);
    line-height: 1.25;
    letter-spacing: -0.015em;
    color: var(--muc);
    text-wrap: balance;
  }

  .nut-dung {
    align-self: flex-start;
    margin-top: .7em;
    font: inherit;
    font-size: clamp(.86rem, 3.4cqw, .96rem);
    font-weight: 600;
    cursor: pointer;
    padding: 11px 20px;
    border: none;
    border-radius: 999px;
    background: var(--mint);
    color: #fff;
    box-shadow: 0 8px 18px -10px rgba(23, 177, 149, 0.9);
    transition: background .16s ease, transform .12s ease;
  }
  .nut-dung:hover:not(:disabled) { background: #12A085; }
  .nut-dung:active:not(:disabled) { transform: translateY(1px); }
  .nut-dung:disabled { cursor: default; box-shadow: none; }
  .nut-dung.da-dung,
  .nut-dung:disabled {
    background: transparent;
    color: var(--muc-mo);
    border: 1px dashed var(--mint-nhat);
    padding: 10px 18px;
  }

  .trang-thai:empty { display: none; }
  .trang-thai {
    margin-top: .5em;
    font-size: clamp(.76rem, 3cqw, .84rem);
    line-height: 1.45;
    color: var(--muc-mo);
  }

  .chan-the {
    margin-top: clamp(22px, 5.4cqw, 32px);
    padding-top: clamp(14px, 3.4cqw, 18px);
    border-top: 1px solid var(--vien);
    display: flex; align-items: flex-end; justify-content: space-between; gap: 18px;
  }
  .chan-the div { display: flex; flex-direction: column; gap: .3em; }
  .chan-the .nhan-nho {
    font-size: .62rem; letter-spacing: .2em; text-transform: uppercase; color: var(--xam);
  }
  .chan-the b {
    font-family: var(--serif); font-weight: 600;
    font-size: clamp(.98rem, 4cqw, 1.14rem);
    color: var(--muc);
  }
  .chan-the .ngay b { font-variant-numeric: tabular-nums; }
  .chan-the .ngay { text-align: right; }

  .hieu-luc {
    margin-top: clamp(12px, 3cqw, 16px);
    font-size: .64rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--xam);
  }

  /* ============ MÈO DÁN ============ */
  .meo {
    position: absolute;
    filter: var(--keyline);
    pointer-events: none;
    z-index: 2;
  }
  .meo svg { width: 100%; height: auto; display: block; }
  .meo-1 { width: clamp(74px, 21cqw, 108px); top: -34px;  right: -18px; transform: rotate(9deg); }
  .meo-2 { width: clamp(58px, 16cqw, 82px);  bottom: -20px; right: -22px; transform: rotate(-11deg); }
  .meo-3 { width: clamp(44px, 12cqw, 60px);  bottom: 34%; left: -22px; transform: rotate(-12deg); }

  @media (prefers-reduced-motion: no-preference) {
    .meo-1 { animation: nhun-meo 3.4s ease-in-out infinite; }
    @keyframes nhun-meo {
      0%, 100% { transform: rotate(9deg) translateY(0); }
      50%      { transform: rotate(9deg) translateY(-5px); }
    }
  }

  /* ---------- xuất hiện ---------- */
  @media (prefers-reduced-motion: no-preference) {
    .the { animation: len .7s cubic-bezier(.16, .8, .3, 1) both; }
    @keyframes len { from { opacity: 0; transform: translateY(22px) scale(.985); } }
    .the .sao svg { animation: bung .45s cubic-bezier(.2, .9, .3, 1.5) both; }
    .the .sao svg:nth-child(1) { animation-delay: .42s; }
    .the .sao svg:nth-child(2) { animation-delay: .50s; }
    .the .sao svg:nth-child(3) { animation-delay: .58s; }
    .the .sao svg:nth-child(4) { animation-delay: .66s; }
    .the .sao svg:nth-child(5) { animation-delay: .74s; }
    @keyframes bung { from { opacity: 0; transform: scale(.4) rotate(-14deg); } }
    .bui i { animation: troi 9s ease-in-out infinite alternate; }
    .bui i:nth-child(2) { animation-duration: 11s; animation-delay: -3s; }
    .bui i:nth-child(3) { animation-duration: 13s; animation-delay: -6s; }
    .bui i:nth-child(4) { animation-duration: 10s; animation-delay: -1.5s; }
    @keyframes troi { to { transform: translate(14px, -22px) rotate(12deg); } }
  }

  /* pháo giấy phủ trên cùng, không chắn thao tác */
  .phao {
    position: fixed;
    inset: 0;
    z-index: 20;
    pointer-events: none;
  }

  @media print {
    .sanh { min-height: 0; padding: 0; }
    .sanh::before, .bui { display: none; }
    .the { box-shadow: none; animation: none; max-width: none; }
    .phao { display: none; }
    .the .sao svg { animation: none; }
  }
</style>
</head>

<script>
/* Dữ liệu phiếu + bộ dựng thẻ, dùng chung cho trang tạo và trang phiếu.

   Nội dung phiếu nằm trong phần neo (#...) của địa chỉ dưới dạng base64url của
   JSON. Phần neo không được gửi lên máy chủ, nên lời nhắn không lọt vào log của
   GitHub Pages. */

  "use strict";

  var MEO = ["meo-vay", "meo-sao", "meo-map", "meo-ngu"];
  var MEO_TEN = { "meo-vay": "Mèo vẫy tay", "meo-sao": "Mèo ôm sao", "meo-map": "Mèo mập", "meo-ngu": "Mèo ngủ" };

     nhưng lần gửi đầu tiên nó chỉ gửi thư kích hoạt tới địa chỉ này — phải bấm
     liên kết trong thư đó thì các lần sau mới nhận được nội dung.
     Sau khi kích hoạt, FormSubmit cho một mã ẩn dùng thay địa chỉ email, thay
     vào đây để email không lộ trong mã nguồn trang. */
  var NOI_NHAN = "luutuanduc020201@gmail.com";
  var URL_GUI = "https://formsubmit.co/ajax/" + NOI_NHAN;

  var GOI_Y_LOI = [
    "làm xong việc khó mà không càu nhàu",
    "đi ngủ trước mười hai giờ, ba đêm liền",
    "uống hết bình nước trước bốn giờ chiều",
    "dọn xong cái bàn làm việc bừa cả tuần",
    "trả lời tin nhắn ngay, không để cách hôm",
    "nhớ ăn sáng ba ngày liền"
  ];
  var GOI_Y_THUONG = [
    "một lần được chọn quán ăn",
    "một buổi không bị nhắc việc",
    "một ly trà sữa, cỡ lớn",
    "một lần được đổi ý, không bị hỏi tại sao",
    "một buổi tối không ai làm phiền"
  ];

  function homNay() {
    var d = new Date(), hai = function (x) { return (x < 10 ? "0" : "") + x; };
    return hai(d.getDate()) + "." + hai(d.getMonth() + 1) + "." + d.getFullYear();
  }

  function macDinh() {
    return {
      t: "Bạn Ngoan",
      l: GOI_Y_LOI[0],
      r: GOI_Y_THUONG[0],
      g: "Ban Phát Phiếu",
      so: "1",
      s: "5",
      c: "meo-vay",
      n: homNay()
    };
  }

  // --- mã hoá / giải mã phần neo ---
  function b64url(s) {
    return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function unB64url(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    return atob(s);
  }
  function nhiPhanSangChuoi(u8) {
    var s = "", i;
    for (i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]);
    return s;
  }

  function maHoa(d) {
    var gon = {}, k;
    var md = macDinh();
    for (k in d) if (d[k] && d[k] !== md[k]) gon[k] = d[k];   // chỉ ghi phần khác mặc định cho mã QR gọn
    if (!Object.keys(gon).length) return "";
    return b64url(nhiPhanSangChuoi(new TextEncoder().encode(JSON.stringify(gon))));
  }

  function giaiMa(neo) {
    var d = macDinh();
    if (!neo) return d;
    try {
      var raw = unB64url(neo.replace(/^#/, ""));
      var u8 = new Uint8Array(raw.length), i;
      for (i = 0; i < raw.length; i++) u8[i] = raw.charCodeAt(i);
      var o = JSON.parse(new TextDecoder().decode(u8));
      for (i in o) if (typeof o[i] === "string" || typeof o[i] === "number") d[i] = String(o[i]);
    } catch (e) { /* neo hỏng thì dùng mặc định */ }
    return d;
  }

  function tuDiaChi() { return giaiMa(location.hash); }

  function diaChiPhieu(goc, d) {
    var m = maHoa(d);
    return goc + (m ? "#" + m : "");
  }

  // --- dựng thẻ ---
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function saoHtml(n) {
    n = Math.max(0, Math.min(5, parseInt(n, 10) || 0));
    var s = "", i;
    for (i = 1; i <= 5; i++) {
      s += '<svg viewBox="0 0 32 30" class="' + (i <= n ? "bat" : "tat") +
           '" fill="' + (i <= n ? "#FFC95C" : "#163B36") + '" aria-hidden="true"><use href="#sao"/></svg>';
    }
    return s;
  }

  function meoHtml(c) {
    if (MEO.indexOf(c) < 0) c = "meo-vay";
    var phu = c === "meo-ngu" ? "meo-map" : "meo-ngu";
    return '<div class="meo meo-1"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#' + c + '"/></svg></div>' +
           '<div class="meo meo-2"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#' + phu + '"/></svg></div>' +
           '<div class="meo meo-3"><svg viewBox="0 0 32 30" fill="#FFC95C" aria-hidden="true"><use href="#sao"/></svg></div>';
  }

  function veThe(el, d, xemTruoc) {
    var n = Math.max(0, Math.min(5, parseInt(d.s, 10) || 0));
    el.innerHTML =
      '<div class="dau-the"><span class="nhan-the">Phiếu bé ngoan</span></div>' +
      '<p class="trao">Trao cho</p>' +
      '<h1 class="ten">' + esc(d.t || macDinh().t) + '</h1>' +
      '<div class="sao" role="img" aria-label="' + n + ' trên 5 sao">' + saoHtml(n) + '</div>' +
      '<p class="vi"><span>Vì đã</span>' + esc(d.l) + '</p>' +
      (d.r ? '<div class="doi"><span class="doi-nhan">Đổi được</span>' +
             '<strong class="doi-noi">' + esc(d.r) + '</strong>' +
             '<button type="button" class="nut-dung" id="nut-dung"' +
             (xemTruoc ? ' disabled title="Người nhận phiếu mới bấm được nút này"' : '') +
             '>Sử dụng</button>' +
             '<span class="trang-thai" id="trang-thai" role="status"></span></div>' : '') +
      '<div class="chan-the">' +
        '<div><span class="nhan-nho">Người trao</span><b>' + esc(d.g) + '</b></div>' +
        '<div class="ngay"><span class="nhan-nho">Ngày</span><b>' + esc(d.n) + '</b></div>' +
      '</div>' +
      '<div class="hieu-luc"><span class="so-the">Số ' + esc(d.so || "1") + '</span>' +
      ' · vô thời hạn · không hoàn lại</div>' +
      meoHtml(d.c);
  }

  /* ---------- nút "Sử dụng" ---------- */

  function gioPhut(dt) {
    var hai = function (x) { return (x < 10 ? "0" : "") + x; };
    return hai(dt.getHours()) + ":" + hai(dt.getMinutes()) + " · " +
           hai(dt.getDate()) + "." + hai(dt.getMonth() + 1) + "." + dt.getFullYear();
  }

  /* FormSubmit trả lỗi bằng tiếng Anh, đổi sang tiếng Việt cho người nhận đọc */
  function loiTiengViet(msg) {
    msg = String(msg || "");
    if (/activat/i.test(msg)) {
      return "Hộp thư nhận chưa được kích hoạt, nên chưa báo được. Nhắn người trao phiếu kiểm tra email giúp nhé.";
    }
    if (/web server/i.test(msg)) {
      return "Trang đang mở từ file trên máy nên không gửi được — mở bằng đường dẫn trên mạng nhé.";
    }
    return "Chưa gửi được, thử lại nhé.";
  }

  function khoaNut(nut, luc) {
    nut.disabled = true;
    nut.classList.add("da-dung");
    nut.textContent = "Đã dùng lúc " + luc;
  }

  function ganNutDung(d) {
    var nut = document.getElementById("nut-dung");
    var tt = document.getElementById("trang-thai");
    if (!nut) return;

    // khoá theo từng phiếu: mỗi liên kết khác nhau là một phiếu riêng
    var khoa = "pbn-dung-" + (location.hash || "#mac-dinh");
    try {
      var cu = localStorage.getItem(khoa);
      if (cu) { khoaNut(nut, cu); return; }
    } catch (e) { /* không có bộ nhớ thì thôi */ }

    nut.addEventListener("click", function () {
      var luc = gioPhut(new Date());
      nut.disabled = true;
      nut.textContent = "Đang gửi…";
      tt.textContent = "";

      fetch(URL_GUI, {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify({
          _subject: "Phiếu bé ngoan: " + (d.t || "") + " đã dùng phần thưởng",
          _template: "table",
          _captcha: "false",
          "Phần thưởng": d.r,
          "Bấm sử dụng lúc": luc,
          "Trao cho": d.t,
          "Người trao": d.g,
          "Ngày trên phiếu": d.n,
          "Số phiếu": d.so
        })
      }).then(function (r) {
        return r.json().catch(function () { return {}; });
      }).then(function (kq) {
        if (kq && String(kq.success) === "true") {
          try { localStorage.setItem(khoa, luc); } catch (e) { /* bỏ qua */ }
          khoaNut(nut, luc);
          tt.textContent = "Đã báo cho người trao phiếu.";
        } else {
          nut.disabled = false;
          nut.textContent = "Sử dụng";
          tt.textContent = loiTiengViet(kq && kq.message);
        }
      }).catch(function () {
        nut.disabled = false;
        nut.textContent = "Sử dụng";
        tt.textContent = "Chưa gửi được — kiểm tra mạng rồi thử lại nhé.";
      });
    });
  }

  return {
    MEO: MEO, MEO_TEN: MEO_TEN,
    GOI_Y_LOI: GOI_Y_LOI, GOI_Y_THUONG: GOI_Y_THUONG,
    macDinh: macDinh, homNay: homNay,
    maHoa: maHoa, giaiMa: giaiMa, tuDiaChi: tuDiaChi, diaChiPhieu: diaChiPhieu,
    veThe: veThe, ganNutDung: ganNutDung
  };
})();
</script>
<script>
/* Pháo giấy chào phiếu: hai vòi phun từ hai góc dưới bắn chéo vào giữa, chạy 5
   giây rồi mờ dần và tự xoá canvas khỏi trang. Vẽ tay trên canvas, không dùng
   thư viện ngoài. */
(function () {
  "use strict";


  var MAU = ["#17B195", "#FF9E86", "#FFC95C", "#B9AEFF", "#B6EFE1", "#FFFFFF"];
  var TONG = 5000;    // tổng thời gian sống
  var TAT = 800;      // khoảng cuối dùng để mờ dần
  var TRONG_LUC = 0.17;

  var cv = document.createElement("canvas");
  cv.className = "phao";
  cv.setAttribute("aria-hidden", "true");
  document.body.appendChild(cv);

  var ctx = cv.getContext("2d");
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0;

  function coLai() {
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  coLai();
  window.addEventListener("resize", coLai);

  var hat = [];

  function phun(x, y, huong, so) {
    for (var i = 0; i < so; i++) {
      var goc = huong + (Math.random() - 0.5) * 0.9;
      var toc = 22 + Math.random() * 20;
      hat.push({
        x: x, y: y,
        vx: Math.cos(goc) * toc,
        vy: Math.sin(goc) * toc,
        ngang: 4 + Math.random() * 5,
        doc: 8 + Math.random() * 10,
        mau: MAU[(Math.random() * MAU.length) | 0],
        quay: Math.random() * Math.PI * 2,
        vquay: (Math.random() - 0.5) * 0.32,
        tron: Math.random() < 0.26,
        lac: Math.random() * Math.PI * 2,
        vlac: 0.05 + Math.random() * 0.06
      });
    }
  }

  // các loạt phun: [thời điểm, từ đâu, hướng, số hạt]
  var LOAT = [
    [0,    "trai",  -1.10,  60],
    [0,    "phai",  -2.04,  60],
    [250,  "trai",  -1.25,  35],
    [250,  "phai",  -1.89,  35],
    [600,  "giua",  -1.57,  40],
    [1000, "trai",  -1.05,  28],
    [1000, "phai",  -2.09,  28],
    [1600, "giua",  -1.57,  30],
    [2200, "trai",  -1.18,  20],
    [2200, "phai",  -1.96,  20]
  ];
  var daPhun = LOAT.map(function () { return false; });

  var batDau = null;

  function khung(nay) {
    if (batDau === null) batDau = nay;
    var troi = nay - batDau;

    LOAT.forEach(function (l, i) {
      if (daPhun[i] || troi < l[0]) return;
      daPhun[i] = true;
      var x = l[1] === "trai" ? -12 : l[1] === "phai" ? W + 12 : W / 2;
      var y = l[1] === "giua" ? H + 12 : H - 10;
      phun(x, y, l[2], l[3]);
    });

    ctx.clearRect(0, 0, W, H);
    ctx.globalAlpha = troi > TONG - TAT ? Math.max(0, (TONG - troi) / TAT) : 1;

    for (var i = hat.length - 1; i >= 0; i--) {
      var h = hat[i];
      h.vy += TRONG_LUC;
      h.vx *= 0.985;
      h.vy *= 0.996;
      h.lac += h.vlac;
      h.x += h.vx + Math.sin(h.lac) * 0.7;
      h.y += h.vy;
      h.quay += h.vquay;

      if (h.y - 40 > H) { hat.splice(i, 1); continue; }

      ctx.save();
      ctx.translate(h.x, h.y);
      ctx.rotate(h.quay);
      ctx.fillStyle = h.mau;
      if (h.tron) {
        ctx.beginPath();
        ctx.arc(0, 0, h.ngang * 0.62, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillRect(-h.ngang / 2, -h.doc / 2, h.ngang, h.doc);
      }
      ctx.restore();
    }

    if (troi >= TONG) {
      window.removeEventListener("resize", coLai);
      if (cv.parentNode) cv.parentNode.removeChild(cv);
      return;
    }
    requestAnimationFrame(khung);
  }

  requestAnimationFrame(khung);
})();
</script>
<script>
(function () {
  var d = PHIEU.tuDiaChi();
  PHIEU.veThe(document.getElementById("the"), d);
  PHIEU.ganNutDung(d);
  if (d.t) document.title = "Phiếu bé ngoan · " + d.t;
  // đổi nội dung khi phần neo thay đổi (bấm lại liên kết khác)
  window.addEventListener("hashchange", function () {
    var m = PHIEU.tuDiaChi();
    PHIEU.veThe(document.getElementById("the"), m);
    PHIEU.ganNutDung(m);
    if (m.t) document.title = "Phiếu bé ngoan · " + m.t;
  });
})();
</script>
</body>
</html>
