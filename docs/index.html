<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFEDE1">
<meta name="description" content="Quét mã QR để mở phiếu bé ngoan.">
<style>*{margin:0;padding:0}html,body{min-height:100%}svg,img{max-width:100%}</style>
<title>Mã QR Phiếu Bé Ngoan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@500;600;700&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --ink:       #3B3355;
    --ink-soft:  #7A709A;
    --paper:     #FFFDF8;
    --hong:      #FF8FA8;
    --hong-soft: #FFE4EA;
    --mint:      #4FC7B8;
    --mint-soft: #DBF6F1;
    --vang:      #FFC24A;
    --tim:       #B69CFF;

    --bg:        #FFEDE1;
    --bg-2:      #FFE0CF;
    --text:      #4A3F63;
    --text-soft: #8B7FA6;
    --line:      #F0D6C6;
    --surface-2: #FFF7F1;
    --focus:     #6C4BD8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #221D33; --bg-2: #191428; --text: #F1ECFF; --text-soft: #A79BC7;
      --line: #453B63; --surface-2: #322B49; --focus: #C7B4FF;
    }
  }
  :root[data-theme="dark"] {
    --bg: #221D33; --bg-2: #191428; --text: #F1ECFF; --text-soft: #A79BC7;
    --line: #453B63; --surface-2: #322B49; --focus: #C7B4FF;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, var(--bg-2), transparent 55%),
      radial-gradient(circle at 85% 88%, var(--bg-2), transparent 52%);
    color: var(--text);
    font-family: Quicksand, "Segoe UI", system-ui, sans-serif;
    font-weight: 600;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 10px; }

  .wrap {
    position: relative;
    max-width: 1060px;
    margin: 0 auto;
    padding: 40px 20px 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 26px;
    text-align: center;
  }

  .eyebrow {
    font-size: .8rem; font-weight: 700;
    letter-spacing: .2em; text-transform: uppercase;
    color: var(--text-soft);
  }
  h1 {
    margin: 0;
    font-family: "Baloo 2", Quicksand, sans-serif;
    font-weight: 800;
    font-size: clamp(2.1rem, 8vw, 3.8rem);
    line-height: .98;
    letter-spacing: -0.02em;
    text-wrap: balance;
    color: var(--hong);
    -webkit-text-stroke: 3px var(--ink);
    paint-order: stroke fill;
  }
  .sub {
    font-size: clamp(1rem, 3.4vw, 1.2rem);
    color: var(--text);
    max-width: 30ch;
    text-wrap: balance;
    line-height: 1.5;
  }

  /* ---------- khối quét ---------- */
  .quet {
    display: grid;
    grid-template-columns: minmax(180px, 260px) auto;
    align-items: center;
    gap: clamp(8px, 3vw, 34px);
    margin-top: 4px;
  }

  .chi-dan { display: flex; flex-direction: column; align-items: center; gap: 2px; }

  .nhan {
    font-family: "Baloo 2", Quicksand, sans-serif;
    font-weight: 800;
    font-size: clamp(1.5rem, 6vw, 2.5rem);
    line-height: 1.02;
    color: var(--vang);
    -webkit-text-stroke: 2.6px var(--ink);
    paint-order: stroke fill;
    transform: rotate(-6deg);
    text-wrap: balance;
  }
  .mui-ten { color: var(--ink); }
  .mui-ten svg { width: 100%; height: auto; display: block; }
  .mui-ten.ngang { width: clamp(120px, 22vw, 220px); }
  .mui-ten.doc { display: none; width: clamp(52px, 15vw, 76px); }

  .bang {
    position: relative;
    padding: clamp(18px, 3.6vw, 30px);
    background: var(--paper);
    border: 4px solid var(--ink);
    border-radius: 26px;
    box-shadow: 0 16px 36px -16px rgba(59,51,85,.5);
    transform: rotate(-1.6deg);
  }
  .bang::after {
    content: "";
    position: absolute; inset: 9px;
    border: 2px dashed var(--hong);
    border-radius: 18px;
    pointer-events: none;
  }
  .bang .qr {
    display: block;
    width: clamp(190px, 46vw, 300px);
    height: auto;
    color: var(--ink);
  }
  /* băng dính hai góc */
  .tape {
    position: absolute;
    width: 74px; height: 26px;
    background: color-mix(in srgb, var(--mint) 42%, #fff);
    border: 2px solid color-mix(in srgb, var(--ink) 30%, transparent);
    opacity: .92;
  }
  .tape.t1 { top: -14px; left: -20px; transform: rotate(-32deg); }
  .tape.t2 { bottom: -14px; right: -20px; transform: rotate(-32deg); }

  .ban-tho {
    position: absolute;
    right: -8%; bottom: -13%;
    width: clamp(72px, 15vw, 116px);
    transform: rotate(8deg);
  }
  .ban-tho svg { width: 100%; height: auto; display: block; }

  /* ---------- hướng dẫn + dự phòng ---------- */
  .buoc {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 10px 14px;
    margin-top: 6px;
    font-size: .98rem;
    color: var(--text-soft);
  }
  .buoc span {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--surface-2);
    border: 2px solid var(--line);
    border-radius: 999px;
    padding: 9px 16px;
    font-weight: 700;
  }
  .buoc b {
    display: grid; place-items: center;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--hong); color: #3B3355;
    font-size: .82rem;
  }

  .du-phong { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 4px; }
  .du-phong p { margin: 0; font-size: .92rem; color: var(--text-soft); }
  .btn {
    font: inherit; font-weight: 700; font-size: 1rem;
    text-decoration: none;
    padding: 13px 24px;
    border-radius: 999px;
    border: 2px solid var(--ink);
    background: var(--hong);
    color: #3B3355;
    box-shadow: 0 4px 0 var(--ink);
    display: inline-flex; align-items: center; gap: 9px;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }

  /* ---------- trang trí nền ---------- */
  .sky { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: -1; }
  .sky > * { position: absolute; }
  .sky svg { display: block; width: 100%; height: auto; }
  .s1 { top: 6%;  left: 3%;  width: 74px; transform: rotate(-8deg); }
  .s2 { top: 14%; right: 4%; width: 44px; }
  .s3 { bottom: 16%; left: 6%; width: 38px; transform: rotate(12deg); }
  .s4 { bottom: 8%; right: 8%; width: 62px; transform: rotate(-6deg); }
  .s5 { top: 44%; left: 1%; width: 30px; }

  @media (max-width: 720px) {
    .quet { grid-template-columns: 1fr; justify-items: center; gap: 4px; }
    .chi-dan { order: -1; }
    .mui-ten.ngang { display: none; }
    .mui-ten.doc { display: block; }
    .bang .qr { width: min(64vw, 320px); }
    .nhan { transform: rotate(-4deg); }
    .ban-tho { right: -6%; bottom: -11%; }
    .s1, .s4 { width: 52px; }
    .sky .s2, .sky .s5 { display: none; }
  }

  @media (prefers-reduced-motion: no-preference) {
    .mui-ten { animation: nhun 1.5s ease-in-out infinite; }
    @keyframes nhun { 50% { transform: translateX(9px) rotate(0deg); } }
    .bang { animation: hien .6s cubic-bezier(.2,.9,.3,1.35) both; }
    @keyframes hien { from { opacity: 0; transform: rotate(-6deg) scale(.9); } }
    .s2, .s3, .s5 { animation: lap-lanh 2.6s ease-in-out infinite; }
    .s3 { animation-delay: .8s; }
    .s5 { animation-delay: 1.4s; }
    @keyframes lap-lanh { 50% { opacity: .45; transform: scale(.86) rotate(10deg); } }
    @media (max-width: 720px) {
      .mui-ten.doc { animation: nhun-doc 1.5s ease-in-out infinite; }
      @keyframes nhun-doc { 50% { transform: translateY(9px); } }
    }
  }

  @page { size: A4 portrait; margin: 12mm; }
  @media print {
    body { background: #fff; }
    .sky, .du-phong { display: none; }
    .bang { box-shadow: none; animation: none; transform: none; }
    .mui-ten { animation: none; }
    -webkit-print-color-adjust: exact;
  }
</style>
</head>
