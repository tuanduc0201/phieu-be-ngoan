<title>Phiếu Bé Ngoan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
{{include:partials/tokens.css}}

  /* ---------- sảnh: chỉ có tấm phiếu, không có gì khác ---------- */
  .sanh {
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: clamp(30px, 6vw, 56px) clamp(28px, 5vw, 40px);
    position: relative;
    overflow: hidden;
  }
  .sanh::before {
    content: "";
    position: absolute; inset: -20%;
    background:
      radial-gradient(38% 30% at 22% 18%, rgba(255, 94, 122, 0.16), transparent 70%),
      radial-gradient(34% 28% at 82% 82%, rgba(228, 179, 99, 0.12), transparent 70%);
    pointer-events: none;
  }

  /* tim bay lơ lửng phía sau, rất nhẹ */
  .bui { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .bui i {
    position: absolute;
    display: block;
    width: 14px; height: 14px;
    background: var(--hong);
    opacity: .12;
    clip-path: path("M7 13.5C3.9 11 0.5 8.6 0.5 5.4 0.5 3 2.4 1.3 4.5 1.3c1.2 0 2.2.5 2.5 1.4.3-.9 1.3-1.4 2.5-1.4 2.1 0 4 1.7 4 4.1 0 3.2-3.4 5.6-6.5 8.1z");
    transform: scale(1);
  }
  .bui i:nth-child(1) { left: 12%; top: 22%; width: 26px; height: 26px; }
  .bui i:nth-child(2) { left: 80%; top: 30%; width: 18px; height: 18px; }
  .bui i:nth-child(3) { left: 26%; top: 74%; width: 34px; height: 34px; opacity: .08; }
  .bui i:nth-child(4) { left: 68%; top: 80%; width: 20px; height: 20px; }

{{include:partials/phieu.css}}

  /* ---------- xuất hiện ---------- */
  @media (prefers-reduced-motion: no-preference) {
    .the { animation: len .7s cubic-bezier(.16, .8, .3, 1) both; }
    @keyframes len { from { opacity: 0; transform: translateY(22px) scale(.985); } }
    .the .tim svg { animation: bung .45s cubic-bezier(.2, .9, .3, 1.5) both; }
    .the .tim svg:nth-child(1) { animation-delay: .42s; }
    .the .tim svg:nth-child(2) { animation-delay: .50s; }
    .the .tim svg:nth-child(3) { animation-delay: .58s; }
    .the .tim svg:nth-child(4) { animation-delay: .66s; }
    .the .tim svg:nth-child(5) { animation-delay: .74s; }
    @keyframes bung { from { opacity: 0; transform: scale(.4) rotate(-14deg); } }
    .bui i { animation: troi 9s ease-in-out infinite alternate; }
    .bui i:nth-child(2) { animation-duration: 11s; animation-delay: -3s; }
    .bui i:nth-child(3) { animation-duration: 13s; animation-delay: -6s; }
    .bui i:nth-child(4) { animation-duration: 10s; animation-delay: -1.5s; }
    @keyframes troi { to { transform: translate(14px, -22px) rotate(12deg); } }
  }

  @media print {
    .sanh { min-height: 0; padding: 0; }
    .sanh::before, .bui { display: none; }
    .the { box-shadow: none; animation: none; max-width: none; }
    .the .tim svg { animation: none; }
  }
</style>

{{include:partials/sprite.html}}

<main class="sanh">
  <div class="bui" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <article class="the" id="the"></article>
</main>

<script>
{{include:partials/phieu.js}}
</script>
<script>
(function () {
  var d = PHIEU.tuDiaChi();
  PHIEU.veThe(document.getElementById("the"), d);
  if (d.t) document.title = "Phiếu bé ngoan · " + d.t;
  // đổi nội dung khi phần neo thay đổi (bấm lại liên kết khác)
  window.addEventListener("hashchange", function () {
    var m = PHIEU.tuDiaChi();
    PHIEU.veThe(document.getElementById("the"), m);
    if (m.t) document.title = "Phiếu bé ngoan · " + m.t;
  });
})();
</script>
